
name: Enterprise Manual Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment"
        required: true
        type: choice
        options:
          - FDE-YT-Cold
        default: FDE-YT-Cold

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Streamlit to EC2 using SSM
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy to EC2 via AWS Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-06124809c8b8b97cd" \
            --document-name "AWS-RunShellScript" \
            --comment "Cold Chain Logistics deployment" \
            --parameters '{"commands":["set -e","cd /home/ubuntu/FDE-cold-chain-logistics-Project","sudo -u ubuntu git pull --ff-only origin main","sudo -u ubuntu /home/ubuntu/FDE-cold-chain-logistics-Project/.venv/bin/python -m pip install -r requirements.txt","systemctl restart streamlit","systemctl is-active --quiet streamlit"]}' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          if aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-06124809c8b8b97cd"; then
            echo "Deployment completed successfully."
          else
            echo "Deployment failed. Fetching command output..."
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-06124809c8b8b97cd" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
              --output json || true
            exit 1
          fi
